<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tortillería "Don Mateo"</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fff8f0;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .contenedor {
      background: white;
      padding: 40px;
      border-radius: 15px;
      width: 90%;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h1 {
      color: orange;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .descripcion {
      font-size: 20px;
      color: green;
      margin-bottom: 30px;
    }

    .imagenes {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .imagenes img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
    }

    .campo {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #444;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 15px;
      font-size: 18px;
      background-color: orange;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background-color: #e69500;
    }

    .pedido {
      margin-top: 30px;
      padding: 20px;
      border-radius: 10px;
      background-color: #fff3e0;
      display: none;
      text-align: left;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>Tortillería Don Mateo</h1>

    <p class="descripcion">
      Bienvenido a la página de la Tortillería Don Mateo.<br>
      Puedes realizar tu pedido ingresando los siguientes datos.
    </p>

    <div class="imagenes">
      <img src="izq.jpeg" alt="Tortillas">
      <img src="cenn.png" alt="Tortillas">
      <img src="der.jpeg" alt="Tortillas">
    </div>

    <div class="campo">
      <label>Nombre del cliente</label>
      <input type="text" id="nombre" placeholder="Escribe tu nombre">
    </div>

    <div class="campo">
      <label>Tipo de tortilla</label>
      <select id="tipo">
        <option>Flauta</option>
        <option>Normal</option>
        <option>Taco</option>
      </select>
    </div>

    <div class="campo">
      <label>Cantidad de kilos</label>
      <input type="number" id="kilos" step="0.5" placeholder="Ejemplo: 1.5">
    </div>

    <button onclick="enviarPedido()">Realizar pedido</button>


    <div class="pedido" id="pedidoMostrado"></div>

  </div>

  <script>
    function realizarPedido() {
      const nombre = document.getElementById("nombre").value;
      const tipo = document.getElementById("tipo").value;
      const kilos = document.getElementById("kilos").value;

      if (nombre === "" || kilos === "") {
        alert("Por favor llena todos los campos");
        return;
      }

      const pedidoHTML = `
        <h3>📋 Pedido registrado</h3>
        <p><strong>Cliente:</strong> ${nombre}</p>
        <p><strong>Tipo de tortilla:</strong> ${tipo}</p>
        <p><strong>Kilos:</strong> ${kilos}</p>
        <p>🫓 Tu pedido estará listo para recoger</p>
      `;

      const pedidoDiv = document.getElementById("pedidoMostrado");
      pedidoDiv.innerHTML = pedidoHTML;
      pedidoDiv.style.display = "block";
    }
  </script>
  <script>
function enviarPedido() {
  const nombre = document.getElementById("nombre").value;
  const tipo = document.getElementById("tipo").value;
  const kilos = document.getElementById("kilos").value;

  if (nombre === "" || kilos === "") {
    alert("Por favor llena todos los campos");
    return;
  }

  const url = "https://script.google.com/macros/s/AKfycbz8tNCoWv-ah3Lz9Iwo08QDdMmVsvzoTVr-i_bqd6b4BdM9IVtFHXDFpfHA55ify7X3/exec";

  const datos = new URLSearchParams();
  datos.append("nombre", nombre);
  datos.append("tipo", tipo);
  datos.append("kilos", kilos);

  fetch(url, {
    method: "POST",
    body: datos
  })
  .then(() => {
    // Mostrar pedido en pantalla
    const pedidoDiv = document.getElementById("pedidoMostrado");
    pedidoDiv.innerHTML = `
      <h3>📋 Pedido registrado</h3>
      <p><strong>Cliente:</strong> ${nombre}</p>
      <p><strong>Tipo de tortilla:</strong> ${tipo}</p>
      <p><strong>Kilos:</strong> ${kilos}</p>
      <p>🫓 Tu pedido estará listo para recoger</p>
    `;
    pedidoDiv.style.display = "block";

    // Limpiar campos
    document.getElementById("nombre").value = "";
    document.getElementById("kilos").value = "";
  })
  .catch(error => {
    alert("Error al enviar el pedido 😢");
    console.error(error);
  });
}
</script>



</body>
</html>
